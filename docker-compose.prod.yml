# docker-compose.prod.yml
# Hardens for internal-prod deployment + builds from the standard Dockerfile
# (node:24-bookworm-slim base). Minimus distroless was tried first but its
# `latest` tag ships Node 25, which has an ESM/CJS translator regression that
# breaks google-auth-library (gaxios dynamic fetch import). Sticking to Node 24
# is non-negotiable until Minimus rolls back. Acceptable here because the
# gateway runs in a gated AWS VPC reachable only via SSH tunnel.
#
# Invoke explicitly (Compose does NOT auto-merge this name):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Tip: alias it on EC2 — `alias dcp='docker compose -f docker-compose.yml -f docker-compose.prod.yml'`
#
# Requires Docker Compose v2.20+ for the `!override` list-replace tags.

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /home/ubuntu/ea-agent-sa.json:/run/secrets/gcp-sa.json:ro
      # Workspace-authored skills land in this repo dir so they can be
      # `git add`ed and pushed. Bundled skills (image-baked) stay under
      # `skills/`; agent-authored skills go here.
      - /home/ubuntu/ea-openclaw/workspace-skills:/home/node/.openclaw/workspace/skills
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      GOOGLE_CLOUD_PROJECT: everafter-19954
      GOOGLE_CLOUD_LOCATION: global
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      XDG_CONFIG_HOME: /home/node/.openclaw
    # Loopback-only. Gateway is reached over SSH tunnel; never bind to 0.0.0.0
    # (which is what the base compose does by default).
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    # Base drops NET_RAW + NET_ADMIN; we drop everything.
    cap_drop: !override
      - ALL
    # First-boot: --allow-unconfigured lets the gateway start without a
    # config.yaml so you can finish setup via the Control UI in the browser.
    # Remove once you've persisted a config to ~/.openclaw/config.yaml and
    # want strict-config behavior back.
    command: !override
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "${OPENCLAW_GATEWAY_BIND:-lan}"
      - "--port"
      - "18789"
      - "--allow-unconfigured"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
    # Read-only root FS with writable scratch. Enable after first successful
    # boot — if startup fails, comment these out and re-test, then add caps
    # back one at a time only as needed.
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /run
