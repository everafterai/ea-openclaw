# docker-compose.prod.yml
# Hardens for internal-prod deployment + builds from the standard Dockerfile
# (node:24-bookworm-slim base). Minimus distroless was tried first but its
# `latest` tag ships Node 25, which has an ESM/CJS translator regression that
# breaks google-auth-library (gaxios dynamic fetch import). Sticking to Node 24
# is non-negotiable until Minimus rolls back. Acceptable here because the
# gateway runs in a gated AWS VPC reachable only via SSH tunnel.
#
# Vertex AI is reached through a self-hosted LiteLLM sidecar (see `litellm`
# service below). OpenClaw's bundled `gaxios` 7.1.4 + google-auth-library
# combo crashes Node's CJS->ESM translator on the dynamic fetch import (GH
# issue openclaw/openclaw#9729). LiteLLM has its own (Python) Vertex auth
# stack, so we route OpenClaw -> LiteLLM (HTTP, OpenAI-compatible) ->
# Vertex. LiteLLM is run from the OSS image; no third-party data path.
#
# Invoke explicitly (Compose does NOT auto-merge this name):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Tip: alias it on EC2 — `alias dcp='docker compose -f docker-compose.yml -f docker-compose.prod.yml'`
#
# Requires Docker Compose v2.20+ for the `!override` list-replace tags.

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Opt-in bundled plugins to keep in dist/extensions at build time.
        # Dockerfile defaults to "" (only providers/channels survive pruning);
        # web-search providers like searxng must be listed explicitly here.
        # Comma- or space-separated extension directory names. Anything in
        # package.json's `files` exclude list is also dropped unless named.
        OPENCLAW_EXTENSIONS: ${OPENCLAW_EXTENSIONS:-searxng,codex}
    volumes:
      # Workspace-authored skills land in this repo dir so they can be
      # `git add`ed and pushed. Bundled skills (image-baked) stay under
      # `skills/`; agent-authored skills go here.
      - /home/ubuntu/ea-openclaw/workspace-skills:/home/node/.openclaw/workspace/skills
    environment:
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      XDG_CONFIG_HOME: /home/node/.openclaw
    depends_on:
      litellm:
        condition: service_healthy
    # Loopback-only. Gateway is reached over SSH tunnel; never bind to 0.0.0.0
    # (which is what the base compose does by default).
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    # Base drops NET_RAW + NET_ADMIN; we drop everything.
    cap_drop: !override
      - ALL
    # First-boot: --allow-unconfigured lets the gateway start without a
    # config.yaml so you can finish setup via the Control UI in the browser.
    # Remove once you've persisted a config to ~/.openclaw/config.yaml and
    # want strict-config behavior back.
    command: !override
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "${OPENCLAW_GATEWAY_BIND:-lan}"
      - "--port"
      - "18789"
      - "--allow-unconfigured"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
    # Read-only root FS with writable scratch. Enable after first successful
    # boot — if startup fails, comment these out and re-test, then add caps
    # back one at a time only as needed.
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /run

  # ----------------------------------------------------------------------
  # LiteLLM proxy — translates OpenAI-compatible HTTP into Vertex AI calls
  # using its own (Python) google-auth stack. Internal-only: no host port
  # binding; openclaw-gateway reaches it at http://litellm:4000 via the
  # default compose network. Self-hosted from upstream OSS image; no data
  # leaves the VPC except through the existing Vertex subprocessor path.
  #
  # Cost tracking: enabled via the `litellm-db` Postgres sidecar below.
  # LiteLLM persists per-request spend rows there and exposes:
  #   /spend/logs, /global/spend/report, /user/daily/activity, /user/info.
  # Without DATABASE_URL set, these endpoints 404 or return nothing — that
  # was the original cause of `lc spend` showing no data. Prisma migrations
  # run automatically on startup when DATABASE_URL is present.
  # ----------------------------------------------------------------------
  litellm:
    # Pin to a specific tag for reproducibility. Bump deliberately; do NOT
    # use a moving tag like `latest`. Check releases:
    #   https://github.com/BerriAI/litellm/releases
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - /home/ubuntu/ea-agent-sa.json:/run/secrets/gcp-sa.json:ro
      - ./deploy/litellm/config.yaml:/etc/litellm/config.yaml:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID:-everafter-19954}
      GOOGLE_CLOUD_LOCATION: ${GCP_LOCATION:-us-central1}
      # Master key OpenClaw will use to call LiteLLM. Generate once and keep
      # in `.env` (never commit). On EC2:
      #   echo "LITELLM_MASTER_KEY=sk-$(openssl rand -hex 24)" >> .env
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      # Encryption key for stored API credentials. Cannot be rotated after
      # deployment without rewriting encrypted rows. Generate once:
      #   echo "LITELLM_SALT_KEY=sk-$(openssl rand -hex 24)" >> .env
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY must be set in .env}
      # Spend tracking backend. Internal-only Postgres; never reached from
      # outside the compose network.
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set in .env}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    command:
      - "--config"
      - "/etc/litellm/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "1"
    depends_on:
      litellm-db:
        condition: service_healthy
    # Internal-only — never expose 4000 on the host.
    expose:
      - "4000"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # Postgres backing store for LiteLLM spend tracking + key/team metadata.
  # Internal-only: never bind 5432 to the host. Data persists in the named
  # volume `litellm_db_data` so spend history survives `docker compose down`.
  # ----------------------------------------------------------------------
  litellm-db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set in .env}
      POSTGRES_DB: litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # SearXNG — self-hosted meta-search engine. Provides web_search results
  # to the OpenClaw gateway via the bundled `searxng` extension plugin
  # (extensions/searxng) without any API key.
  #
  # Internal-only: never bind 8080 to the host. openclaw-gateway reaches it
  # at http://searxng:8080 via the default compose network.
  #
  # Wiring (apply once on EC2, in /home/ubuntu/.openclaw/openclaw.json):
  #   "tools":   { "web": { "search": { "provider": "searxng" } } }
  #   "plugins": { "entries": { "searxng":
  #     { "config": { "webSearch": { "baseUrl": "http://searxng:8080" } } } } }
  # Then `bai reload --hot` (config-only change).
  #
  # The searxng image's entrypoint substitutes ${SEARXNG_SECRET} into
  # /etc/searxng/settings.yml at startup (replaces the literal placeholder
  # `ultrasecretkey`). Generate once on EC2:
  #   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> .env
  # ----------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
      UWSGI_WORKERS: ${SEARXNG_UWSGI_WORKERS:-2}
      UWSGI_THREADS: ${SEARXNG_UWSGI_THREADS:-4}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:rw
    expose:
      - "8080"
    cap_drop:
      - ALL
    cap_add:
      # The image's entrypoint runs `sed -i` over settings.yml and chowns
      # cache dirs on first boot; without these the container exits before
      # uWSGI starts.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

volumes:
  litellm_db_data:
