# jira-cli config — baked into the image at /etc/jira/.config.yml.
# Referenced by JIRA_CONFIG_FILE (set in docker-compose.yml).
#
# Token is NOT stored here. The agent reads JIRA_API_TOKEN from the
# container env at runtime (sourced from .env on the EC2 host).
#
# To regenerate from scratch, run `jira init` against a Jira workspace
# and paste the resulting YAML over this file (minus the api_token).
# Field reference: https://github.com/ankitpokhrel/jira-cli

installation: cloud
# Scoped API tokens (ATATT3*) must be sent to Atlassian's gateway, not the
# site URL. The cloud ID below is fetched once from
#   https://everafterai.atlassian.net/_edge/tenant_info
# and is stable per workspace. Classic tokens would also work against
# https://everafterai.atlassian.net, but scoped tokens require the gateway.
server: https://api.atlassian.com/ex/jira/a0387066-872e-48c3-b584-a3641633c0a3
login: shai@everafter.ai
project:
  key: EV
  type: classic
epic:
  name: customfield_10001
  link: customfield_10000
issue:
  fields:
    custom: []
