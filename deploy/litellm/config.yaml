# LiteLLM proxy config — Vertex AI Gemini models.
#
# Loaded by the `litellm` service in docker-compose.prod.yml. The proxy uses
# its own Python google-auth stack to authenticate to Vertex via the SA JSON
# mounted at $GOOGLE_APPLICATION_CREDENTIALS, so we sidestep the gaxios
# dynamic-fetch crash in OpenClaw's bundled google-auth-library.
#
# To add a model, append an entry to `model_list`. `model_name` is the alias
# OpenClaw will reference (`litellm/<alias>`); `litellm_params.model` is the
# Vertex resource name (`vertex_ai/<model-id>`).
#
# Vertex Gemini model ids do NOT use a `.x` minor version (no `gemini-3.1-pro`
# — Vertex returns 404). Verified ids enabled for everafter-19954 at the
# `global` location (per direct generateContent probe):
#   vertex_ai/gemini-3-pro-preview
#   vertex_ai/gemini-2.5-pro
#   vertex_ai/gemini-2.5-flash
#   vertex_ai/gemini-2.0-flash
# Authoritative list:
#   https://console.cloud.google.com/vertex-ai/model-garden?project=everafter-19954

model_list:
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION
  
  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-2.5-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-2.5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-2.0-flash
    litellm_params:
      model: vertex_ai/gemini-2.0-flash
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: os.environ/GOOGLE_CLOUD_LOCATION

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
